version: '3.8'

services:
  temco-srs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: temco-srs
    ports:
      - "127.0.0.1:8093:80"
    networks:
      - srs-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  srs-network:
    driver: bridge
    name: srs-network
